# Dependabot version updates. Security updates are configured in the GitHub
# repo settings and are not limited by the grouping below.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
      prefix-development: deps-dev
    groups:
      # One PR per week for every minor and patch update.
      npm-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    ignore:
      # Framework majors are upgraded by hand after reading the migration guide.
      - dependency-name: next
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint-config-next
        update-types: ["version-update:semver-major"]
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      # The mongodb driver must stay in Mongoose's own range (ADR 0017) so
      # Mongoose, Better Auth and our code share ONE driver copy. Bump it by
      # hand together with mongoose; patch updates are still allowed.
      - dependency-name: mongodb
        update-types:
          ["version-update:semver-minor", "version-update:semver-major"]
      # Auth library majors are upgraded by hand after reading the changelog.
      - dependency-name: better-auth
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"
