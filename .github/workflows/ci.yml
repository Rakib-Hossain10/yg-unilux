name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Opt out of Next.js telemetry in CI.
  NEXT_TELEMETRY_DISABLED: "1"
  # Must satisfy devEngines.packageManager in package.json.
  NPM_VERSION: 12.1.0

jobs:
  checks:
    name: Lint, typecheck, unit tests, build, audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          # setup-node's npm cache runs `npm config get cache` with Node 22's
          # bundled npm 10, which devEngines rejects. ~/.npm is cached below.
          package-manager-cache: false

      # package.json devEngines requires npm 12; Node 22 ships npm 10.
      # Installed from outside the checkout so devEngines does not apply yet.
      - name: Install npm ${{ env.NPM_VERSION }}
        working-directory: ${{ runner.temp }}
        run: npm install --ignore-scripts --global "npm@${NPM_VERSION}"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ env.NPM_VERSION }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-${{ env.NPM_VERSION }}-

      # Dependency install scripts stay blocked in CI, matching the
      # allowScripts deny list in package.json (none of them are needed).
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Deliberately no secrets: the app must build without any env values.
      - run: npm run build
      - run: npm audit --audit-level=high

  e2e:
    name: Playwright (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          # setup-node's npm cache runs `npm config get cache` with Node 22's
          # bundled npm 10, which devEngines rejects. ~/.npm is cached below.
          package-manager-cache: false

      # package.json devEngines requires npm 12; Node 22 ships npm 10.
      # Installed from outside the checkout so devEngines does not apply yet.
      - name: Install npm ${{ env.NPM_VERSION }}
        working-directory: ${{ runner.temp }}
        run: npm install --ignore-scripts --global "npm@${NPM_VERSION}"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ env.NPM_VERSION }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-${{ env.NPM_VERSION }}-

      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release checksums file.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned, checksum verified)
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          checksums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          mkdir -p "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          curl -fsSLO "$base/$archive"
          curl -fsSLO "$base/$checksums"
          # The archive must match the pinned hash, and the release's own
          # checksums file must list that same hash.
          grep -qx "${GITLEAKS_SHA256}  ${archive}" "$checksums"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict -
          tar -xzf "$archive" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      - name: Scan full git history
        run: gitleaks git --redact --no-banner --config .gitleaks.toml --verbose .
